<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para mi mamá ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    overflow:hidden;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;

    background:
    radial-gradient(circle at 20% 20%, rgba(255,100,200,.25), transparent 30%),
    radial-gradient(circle at 80% 30%, rgba(100,150,255,.25), transparent 30%),
    radial-gradient(circle at 50% 80%, rgba(255,255,255,.08), transparent 25%),
    linear-gradient(to bottom,#01010f,#08122e,#130b2f);
}

/* Estrellas */
.estrella{
    position:absolute;
    background:white;
    border-radius:50%;
    animation:brillar 2s infinite alternate;
}

@keyframes brillar{
    from{
        opacity:.2;
        transform:scale(.8);
    }
    to{
        opacity:1;
        transform:scale(1.3);
    }
}

/* Estrella fugaz */
.fugaz{
    position:absolute;
    width:250px;
    height:3px;
    background:linear-gradient(to right,white,transparent);
    transform:rotate(25deg);
    animation:fugaz 5s linear infinite;
}

@keyframes fugaz{
    0%{
        top:10%;
        left:-30%;
        opacity:1;
    }
    100%{
        top:70%;
        left:120%;
        opacity:0;
    }
}

/* Caja */
#contenedor{
    position:relative;
    z-index:10;
    background:rgba(255,255,255,.12);
    backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,.2);
    padding:40px;
    border-radius:25px;
    text-align:center;
    box-shadow:0 0 40px rgba(255,255,255,.15);
    animation:aparecer 1.5s;
}

@keyframes aparecer{
    from{
        transform:scale(.8);
        opacity:0;
    }
    to{
        transform:scale(1);
        opacity:1;
    }
}

h2,h1{
    color:white;
    text-shadow:0 0 10px pink;
}

input{
    margin-top:20px;
    width:260px;
    padding:12px;
    border:none;
    border-radius:12px;
    outline:none;
    text-align:center;
    font-size:16px;
}

button{
    margin-top:20px;
    padding:12px 35px;
    border:none;
    border-radius:12px;
    background:#ff4d6d;
    color:white;
    font-size:16px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    transform:scale(1.1);
    background:#ff7390;
    box-shadow:0 0 20px #ff4d6d;
}

#mensajeError{
    margin-top:15px;
    color:#ffd1dc;
}

.oculto{
    display:none;
}

#pantallaSecreta{
    position:relative;
    z-index:10;
    text-align:center;
    color:white;
    animation:aparecer 2s;
}

#pantallaSecreta h1{
    font-size:55px;
    animation:latido 1.3s infinite;
}

.granCorazon{
    font-size:100px;
    margin-top:20px;
    animation:latido 1s infinite;
}

@keyframes latido{
    0%,100%{
        transform:scale(1);
    }
    50%{
        transform:scale(1.12);
    }
}

p{
    margin-top:20px;
    font-size:22px;
    line-height:1.5;
    text-shadow:0 0 8px white;
}
</style>
</head>

<body>

<div class="fugaz"></div>

<div id="pantallaInicio">
    <div id="contenedor">
        <h2>🌌 Un pequeño universo para la mejor mamá 🌌</h2>

        <input
            type="password"
            id="clave"
            placeholder="Escribe la clave">

        <br>

        <button onclick="abrir()">
            Entrar ❤️
        </button>

        <p id="mensajeError"></p>
    </div>
</div>

<div id="pantallaSecreta" class="oculto">
    <h1>¡TE AMO MAMÁ! ❤️</h1>

    <div class="granCorazon">💖</div>

    <p>
        En este enorme universo,<br>
        no existe estrella que brille más que tú.<br><br>

        Gracias por tu amor, tus consejos,<br>
        tus abrazos y por estar siempre conmigo.<br><br>

        ✨ Eres la mejor mamá del mundo. ✨
    </p>
</div>

<script>
// Crear muchas estrellas
for(let i=0;i<250;i++){
    let estrella=document.createElement("div");
    estrella.className="estrella";

    let size=Math.random()*3+1;

    estrella.style.width=size+"px";
    estrella.style.height=size+"px";
    estrella.style.left=Math.random()*100+"%";
    estrella.style.top=Math.random()*100+"%";
    estrella.style.animationDelay=Math.random()*2+"s";

    document.body.appendChild(estrella);
}

function abrir(){

    let clave=document.getElementById("clave").value.toLowerCase().trim();

    if(clave=="te amo" || clave=="teamo"){

        document.getElementById("pantallaInicio").classList.add("oculto");
        document.getElementById("pantallaSecreta").classList.remove("oculto");

        // Lluvia de corazones
        for(let i=0;i<60;i++){

            let corazon=document.createElement("div");

            corazon.innerHTML="💖";
            corazon.style.position="absolute";
            corazon.style.left=Math.random()*100+"%";
            corazon.style.top="-50px";
            corazon.style.fontSize=(20+Math.random()*30)+"px";
            corazon.style.transition="5s linear";

            document.body.appendChild(corazon);

            setTimeout(()=>{
                corazon.style.top="110%";
            },100);

            setTimeout(()=>{
                corazon.remove();
            },5500);
        }

    }else{
        document.getElementById("mensajeError").innerHTML=
        "💖 Pista: escribe <b>te amo</b>";
    }
}
</script>

</body>
</html>
</html>
