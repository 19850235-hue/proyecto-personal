<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I LOVE YOU MOM ❤️</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
    }

    body{
        overflow:hidden;
        height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        flex-direction:column;
        background:linear-gradient(135deg,#ffdde1,#ee9ca7);
        font-family:Arial, Helvetica, sans-serif;
    }

    /* Estrellas brillantes */
    body::before{
        content:"";
        position:absolute;
        width:100%;
        height:100%;
        background:
        radial-gradient(white 1px, transparent 1px),
        radial-gradient(white 1px, transparent 1px);
        background-size:60px 60px;
        background-position:0 0,30px 30px;
        opacity:0.3;
        animation:mover 20s linear infinite;
    }

    @keyframes mover{
        from{transform:translateY(0);}
        to{transform:translateY(60px);}
    }

    .heart{
        position:relative;
        width:180px;
        height:180px;
        background:#ff0033;
        transform:rotate(-45deg);
        animation:latido 1.2s infinite;
        box-shadow:0 0 30px #ff0033,
                   0 0 60px #ff4d6d,
                   0 0 90px #ff758f;
    }

    .heart::before,
    .heart::after{
        content:"";
        position:absolute;
        width:180px;
        height:180px;
        background:#ff0033;
        border-radius:50%;
    }

    .heart::before{
        top:-90px;
        left:0;
    }

    .heart::after{
        left:90px;
        top:0;
    }

    @keyframes latido{
        0%{
            transform:rotate(-45deg) scale(1);
        }
        25%{
            transform:rotate(-45deg) scale(1.15);
        }
        50%{
            transform:rotate(-45deg) scale(1.3);
        }
        75%{
            transform:rotate(-45deg) scale(1.15);
        }
        100%{
            transform:rotate(-45deg) scale(1);
        }
    }

    h1{
        margin-top:80px;
        color:white;
        font-size:45px;
        text-shadow:0 0 10px #ff0066,
                    0 0 20px #ff4d88,
                    0 0 40px #ff80aa;
        animation:brillo 2s infinite alternate;
        z-index:2;
    }

    @keyframes brillo{
        from{
            transform:scale(1);
            opacity:0.9;
        }
        to{
            transform:scale(1.08);
            opacity:1;
        }
    }

    /* Corazones flotando */
    .floating{
        position:absolute;
        bottom:-50px;
        color:#ff1744;
        font-size:25px;
        animation:subir 8s linear infinite;
        opacity:0.8;
    }

    .f1{left:10%; animation-delay:0s;}
    .f2{left:25%; animation-delay:2s;}
    .f3{left:40%; animation-delay:4s;}
    .f4{left:60%; animation-delay:1s;}
    .f5{left:75%; animation-delay:3s;}
    .f6{left:90%; animation-delay:5s;}

    @keyframes subir{
        0%{
            transform:translateY(0) scale(1);
            opacity:0;
        }
        20%{
            opacity:1;
        }
        100%{
            transform:translateY(-110vh) scale(1.8);
            opacity:0;
        }
    }
</style>

</head>
<body>

<div class="heart"></div>

<h1>I LOVE YOU MOM ❤️</h1>

<div class="floating f1">❤</div>
<div class="floating f2">❤</div>
<div class="floating f3">❤</div>
<div class="floating f4">❤</div>
<div class="floating f5">❤</div>
<div class="floating f6">❤</div>

</body>
</html>
